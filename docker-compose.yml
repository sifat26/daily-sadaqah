version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: daily_sadaqah_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sadaqah_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sadaqah_local_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-daily_sadaqah}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-sadaqah_user} -d $${POSTGRES_DB:-daily_sadaqah}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
